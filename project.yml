name: SimpleGLP
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.72.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "33"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  SimpleGLP:
    build:
      targets:
        SimpleGLP: all
        SimpleGLPWidget: all
        SimpleGLPWatch: all
    run:
      config: Debug
      storeKitConfiguration: SimpleGLP/Services/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      storeKitConfiguration: SimpleGLP/Services/Products.storekit
      targets:
        - SimpleGLPTests
  SimpleGLPWatch:
    build:
      targets:
        SimpleGLPWatch: all
    run:
      config: Debug

targets:
  SimpleGLP:
    type: application
    platform: iOS
    sources:
      - path: SimpleGLP
        excludes:
          - PrivacyInfo.xcprivacy
          - Services/Products.storekit
      - path: SharedGLP
      - path: SimpleGLP/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SimpleGLP
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.glp
        INFOPLIST_FILE: SimpleGLP/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleGLP/SimpleGLP.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
      - target: SimpleGLPWidget
      - target: SimpleGLPWatch
        embed: true

  SimpleGLPWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SimpleGLPWidget
        excludes:
          - PrivacyInfo.xcprivacy
      - path: SimpleGLPWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SharedGLP
      - path: SimpleGLP/Models/GLPModels.swift
      - path: SimpleGLP/Services/GLPModelStore.swift
      - path: SimpleGLP/Services/ScheduleEngine.swift
      - path: SimpleGLP/Utilities/AppTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.glp.widget
        INFOPLIST_FILE: SimpleGLPWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleGLPWidget/SimpleGLPWidget.entitlements

  SimpleGLPWatch:
    type: application
    platform: watchOS
    sources:
      - path: SimpleGLPWatch
        excludes:
          - PrivacyInfo.xcprivacy
      - path: SimpleGLPWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SharedGLP
      - path: SimpleGLP/Utilities/AppTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.glp.watch
        INFOPLIST_FILE: SimpleGLPWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleGLPWatch/SimpleGLPWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SimpleGLPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimpleGLPTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.glp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SimpleGLP
